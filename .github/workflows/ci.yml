name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Check lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test CPU behavior
        run: uv run pytest -m "not sandbox" -q
      - name: Exercise installed CLI
        run: |
          uv run toolsmith --help
          uv run toolsmith --version
          uv run toolsmith doctor
          uv run toolsmith route --task examples/pagination/task.json --policy configs/router.toml
          uv run toolsmith data generate --config configs/data.toml --output "$RUNNER_TEMP/repair-v1"
          uv run toolsmith data validate --directory "$RUNNER_TEMP/repair-v1"
          uv run toolsmith compare --runs base=results/runs/base sft=results/runs/sft grpo=results/runs/grpo-base --output "$RUNNER_TEMP/report"
          uv run toolsmith view --runs base=results/runs/base sft=results/runs/sft grpo=results/runs/grpo-base --tasks "$RUNNER_TEMP/repair-v1" --output "$RUNNER_TEMP/viewer"
      - name: Build and exercise wheel
        run: |
          uv build
          uv tool run --isolated --python 3.12 --from dist/*.whl toolsmith doctor
          uv tool run --isolated --python 3.12 --from dist/*.whl toolsmith route --task examples/pagination/task.json

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - run: uv sync --locked
      - name: Build pinned test-runner image
        run: docker build -t toolsmith-sandbox:py312-v1 sandbox
      - name: Exercise real container isolation
        run: uv run toolsmith sandbox-check
      - name: Test sandbox and evaluator integration
        env:
          TOOLSMITH_RUN_SANDBOX_TESTS: "1"
        run: uv run pytest -m sandbox -q
